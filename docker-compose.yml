# ─────────────────────────────────────────────────────────────────────────────
# Nodara BR-RAG · Real-Time AI Lakehouse (simulación air-gapped)
#
#   S/4HANA (PG) ─WAL─▶ Debezium ─▶ Kafka ─▶ delta-sink ─▶ Delta Lake @ MinIO
#                                                          ├─ Trino (SQL federado)
#                                                          └─ Unity Catalog (gobierno)
#   Manuales AU (pgvector) ─┐
#   SAP live vía Trino ─────┼─▶ backend FastAPI + LangChain ─▶ Ollama (LLM local)
#                           └─▶ frontend Next.js (única entrada del operador)
#
# Redes:
#   nodara-net    internal → plano de datos/IA. Sin salida a Internet (air-gap).
#   nodara-kb     internal → segmento exclusivo backend ↔ vector-db (KB aislada).
#   nodara-edge   bridge   → plano de operación: solo servicios con puerto publicado
#                            en 127.0.0.1. Docker no publica puertos en redes internal.
#   nodara-uplink bridge   → importación controlada de modelos (perfil "bootstrap").
# ─────────────────────────────────────────────────────────────────────────────
name: nodara-br-rag

services:
  # ═══ 1 · Capa transaccional: SAP S/4HANA simulado (PostgreSQL relacional) ════
  s4hana-db:
    image: postgres:16.15-alpine
    container_name: nodara-s4hana-db
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_DB: s4hana
      POSTGRES_USER: ${S4_DB_ADMIN_USER:?run make env}
      POSTGRES_PASSWORD: ${S4_DB_ADMIN_PASSWORD:?run make env}
      S4_DEBEZIUM_PASSWORD: ${S4_DEBEZIUM_PASSWORD:?run make env}
      S4_TRINO_PASSWORD: ${S4_TRINO_PASSWORD:?run make env}
    volumes:
      - s4hana-data:/var/lib/postgresql/data
      - ./init-scripts/s4hana:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${S4_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d s4hana"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [nodara-net, nodara-edge]

  # ═══ 2 · Capa CDC: Kafka (KRaft, sin ZooKeeper) + Debezium ═══════════════════
  kafka:
    image: apache/kafka:4.3.2
    container_name: nodara-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: KzAIRliyRAq15uJaYOTaJg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 20s
    networks: [nodara-net]

  debezium:
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: nodara-debezium
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      s4hana-db: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: nodara-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      HEAP_OPTS: -Xms256m -Xmx768m
      # Secrets are resolved at runtime as ${env:...}; they never land in connect-configs.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      S4_DEBEZIUM_PASSWORD: ${S4_DEBEZIUM_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:${DEBEZIUM_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [nodara-net, nodara-edge]

  debezium-init:
    image: curlimages/curl:8.23.0
    container_name: nodara-debezium-init
    depends_on:
      debezium: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/cdc/register-connectors.sh"]
    environment:
      CONNECT_URL: http://debezium:8083
    volumes:
      - ./cdc:/cdc:ro
    restart: "no"
    networks: [nodara-net]

  # ═══ 3 · Capa Lakehouse: MinIO (S3) + Delta Lake + Unity Catalog + Trino ═════
  minio:
    # MinIO dejó de publicar imágenes oficiales (2025): fork comunitario mantenido.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: nodara-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nodara-net, nodara-edge]

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: nodara-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/opt/nodara/init-lakehouse.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make env}
      LAKEHOUSE_S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?run make env}
      LAKEHOUSE_S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?run make env}
    volumes:
      - ./lakehouse/minio/init-lakehouse.sh:/opt/nodara/init-lakehouse.sh:ro
    restart: "no"
    networks: [nodara-net]

  unity-catalog:
    image: unitycatalog/unitycatalog:v0.7.0
    container_name: nodara-unity-catalog
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
    volumes:
      - unity-catalog-db:/home/unitycatalog/etc/db
    ports:
      - "127.0.0.1:${UNITY_CATALOG_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/2.1/unity-catalog/catalogs >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks: [nodara-net, nodara-edge]

  trino:
    image: trinodb/trino:484
    container_name: nodara-trino
    restart: unless-stopped
    depends_on:
      minio-init: { condition: service_completed_successfully }
      s4hana-db: { condition: service_healthy }
    environment:
      LAKEHOUSE_S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?run make env}
      LAKEHOUSE_S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?run make env}
      S4_TRINO_PASSWORD: ${S4_TRINO_PASSWORD:?run make env}
    volumes:
      - ./lakehouse/trino/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:${TRINO_PORT:-8080}:8080"
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [nodara-net, nodara-edge]

  delta-sink:
    build: ./lakehouse/delta-sink
    image: nodara/delta-sink:0.1.0
    container_name: nodara-delta-sink
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      trino: { condition: service_healthy }
      unity-catalog: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_PATTERN: ^s4hana\.sap\..+
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?run make env}
      S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?run make env}
      TRINO_HOST: trino
      UC_API: http://unity-catalog:8080/api/2.1/unity-catalog
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks: [nodara-net]

  # ═══ 4 · Capa base de conocimiento: pgvector aislado (solo manuales) ═════════
  vector-db:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: nodara-vector-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: ${VECTOR_DB_USER:?run make env}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:?run make env}
    volumes:
      - vector-data:/var/lib/postgresql/data
      - ./init-scripts/vectordb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${VECTOR_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [nodara-kb, nodara-edge]

  # ═══ 5 · Capa IA & backend: Ollama (LLM local) + orquestador FastAPI ═════════
  ollama:
    image: ollama/ollama:0.40.11
    container_name: nodara-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NO_CLOUD: "true"  # air-gap también a nivel de aplicación: sin modelos remotos
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [nodara-net]

  ollama-bootstrap:
    # "Sneakernet" simulado: única vía de entrada de modelos al enclave. Solo con
    # `make models`; comparte el volumen de modelos con el Ollama air-gapped.
    image: ollama/ollama:0.40.11
    profiles: ["bootstrap"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/tmp/ollama-serve.log 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for model in "$$OLLAMA_CHAT_MODEL" "$$OLLAMA_EMBED_MODEL"; do
          echo ">> importando $$model"
          ollama pull "$$model" || exit 1
        done
        ollama list
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"
    networks: [nodara-uplink]

  backend:
    build: ./backend
    image: nodara/backend:0.1.0
    container_name: nodara-backend
    restart: unless-stopped
    depends_on:
      vector-db: { condition: service_healthy }
      trino: { condition: service_healthy }
      ollama: { condition: service_healthy }
    environment:
      VECTOR_DB_HOST: vector-db
      VECTOR_DB_USER: ${VECTOR_DB_USER:?run make env}
      VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD:?run make env}
      TRINO_HOST: trino
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [nodara-net, nodara-kb]

  # ═══ 6 · Capa frontend: consola del operador (Next.js + Tailwind) ═════════════
  frontend:
    build: ./frontend
    image: nodara/frontend:0.1.0
    container_name: nodara-frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [nodara-net, nodara-edge]

networks:
  nodara-net:
    name: nodara-net
    internal: true
  nodara-kb:
    name: nodara-kb
    internal: true
  nodara-edge:
    name: nodara-edge
    driver_opts:
      # Linux nativo: sin NAT de salida → el plano de operación tampoco llega a Internet.
      # (Docker Desktop ignora esta opción; por eso IA y streaming viven solo en redes internal.)
      com.docker.network.bridge.enable_ip_masquerade: "false"
  nodara-uplink:
    name: nodara-uplink

volumes:
  s4hana-data:
  vector-data:
  kafka-data:
  minio-data:
  unity-catalog-db:
  ollama-models:
